[input]
movement_type = relative
speed_x = 350
speed_y = 350
y_multiplier = 1.0
micro_jitter = True
jitter_amount = 1.0
jitter_min = 0.5
jitter_max = 2.0
curve_variation = 0.05

[humanization]
enabled = true
aim_jitter = 2.0
timing_randomization = 0.1
reaction_delay_min = 50
reaction_delay_max = 150
overshoot_enabled = true
overshoot_amount = 0.05
click_delay_min = 50
click_delay_max = 150

[profile]
active = balanced
auto_apply = false
description = Dengeli mod - orta CPU, önerilen ayarlar

[hotkeys]
aim_toggle = F2
recoil_toggle = F6
trigger_toggle = F3
exit = F4
reload_config = F5
aim_key = LeftMouse
trigger_key = RightMouse

[screen]
auto_detect = true
resolution_x = 1920
resolution_y = 1080
capture_region = fullscreen
capture_fov_x = 1920
capture_fov_y = 1080

[debug]
enabled = true
show_mask = false
show_contours = false
show_target = false
show_overlay = true
log_level = INFO
log_detections = false
save_screenshots = true

[metrics]
enabled = true
save_interval = 60
file_format = json
track_fps = true
track_latency = true
track_detections = true
track_accuracy = true

[advanced]
capture_thread_priority = normal
processing_thread_count = 2
max_frame_buffer = 3
gc_interval = 300
max_consecutive_errors = 10
error_recovery_delay = 5

[game]
wait_for_window = true
use_process_check = true
pause_when_closed = true
process_names = VALORANT.exe, VALORANT-Win64-Shipping.exe, cs2.exe
window_titles = VALORANT, Counter-Strike 2

