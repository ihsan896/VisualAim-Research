# VisualAim-Research Yapılandırma Dosyası
# Bu dosya otomatik olarak yönetilir
# Değişikliklerin etkili olması için uygulamayı yeniden başlatın

[general]
app_name = VisualAim-Research
version = 5.0.0
profile_active = valorant
auto_start = false

[capture]
backend = dxcam
target_fps = 60
buffer_size = 3
full_screen = true
detection_scale = 0.25
fov_x = 400
fov_y = 400
offset_x = 0
offset_y = 0
screen_width = 2560
screen_height = 1440
show_fps = False

[color]
lower_h = 0
lower_s = 120
lower_v = 120
upper_h = 10
upper_s = 255
upper_v = 255
lower_h2 = 170
lower_s2 = 120
lower_v2 = 120
upper_h2 = 179
upper_s2 = 255
upper_v2 = 255
min_blob_size = 40
max_blob_size = 5000
min_solidity = 0.5
min_aspect_ratio = 0.2
max_aspect_ratio = 4.5
blur_kernel_x = 3
blur_kernel_y = 3
morph_open_kernel = 3
morph_close_kernel = 5
morph_iterations = 1

[aim]
enabled = True
mode = snap
speed = 0.35
smoothing = 0.15
fov_enabled = true
fov_radius = 250
fov_radius_x = 280
fov_radius_y = 280
fov_visualization = false
head_offset = 0.28
head_tracking = true
speed_x = 450
speed_y = 450
y_multiplier = 1.0
hybrid_threshold = 150

[kalman]
enabled = true
dt = 0.0167
process_noise = 0.05
measurement_noise = 0.1
initial_covariance = 1.0
max_prediction_frames = 15
max_prediction_age = 10
confidence_decay = 0.95
association_threshold = 200

[trigger]
enabled = True
mode = always_on
activation_key = 0x06
threshold = 8
delay_min = 20
delay_max = 60
randomization = true
first_shot_delay = 0
burst_mode = false
burst_count = 1

[recoil]
enabled = false
mode = move
active_weapon = vandal
compensation_y = 1.0
compensation_x = 1.0
strength = 1.0
randomization = 0.1
max_offset = 100
recovery_rate = 0.1

[weapon_vandal]
